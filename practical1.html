<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu Example</title>
    <style>
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #34495e;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            display: inline-block;   
            padding: 15px 20px;
        }
        nav ul li a {
            text-decoration: none;
            color: white;
            display: inline;  
        }
        nav ul li:hover {
            background-color: #1abc9c;
        }
        .left {
            float: left;
            width: 48%;
            background-color: #ecf0f1;
            padding: 20px;
            margin: 1%;
        }
        .right {
            float: right;
            width: 48%;
            background-color: #bdc3c7;
            padding: 20px;
            margin: 1%;
        }
        .footer {
            clear: both;   
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
        }
        p {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Website</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="left">
        <h2>NAME</h2>
        <p>PRACHI PANDEY</p>
    </div>

    <div class="right">
        <h2>section</h2>
        <p>cse 23</p>
    </div>
    <div class="footer">
        <p>Footer Section </p>
    </div>
</body>
</html>
